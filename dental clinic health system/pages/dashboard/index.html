<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Choice Dental Care</title>
    <link rel="stylesheet" href="../../assets/css/common-styles.css" />
    <link rel="stylesheet" href="../../assets/icons/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .app-main {
            margin: 0 auto;
            padding: 90px 30px;
            min-height: calc(100vh - var(--header-height) - var(--footer-height));
        }

        /* ============================================================
           MODULES GRID
           ============================================================ */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .module-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 15px 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            color: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            min-height: 120px;
        }

        .module-card:hover {
            transform: translateY(-4px);
            border-color: var(--blue);
            box-shadow: var(--shadow-lg);
            background: #a8caffdb;
        }

        .module-card:active {
            transform: translateY(0);
        }

        .module-card .module-icon {
            font-size: 36px;
            color: var(--blue);
            margin-bottom: 4px;
            transition: var(--transition);
        }

        .module-card:hover .module-icon {
            transform: scale(1.05);
        }

        .module-card .module-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.3;
        }

        .module-card .module-subtitle {
            font-size: 13px;
            font-weight: 400;
            color: var(--muted);
            line-height: 1.2;
        }

        /* Module card variations */
        .module-card .module-badge {
            margin-top: 8px;
            padding: 3px 12px;
            border-radius: 40px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            background: var(--teal-pale);
            color: var(--teal);
        }

        /* ============================================================
           MODULE ICON COLORS
           ============================================================ */
        .module-card.icon-blue .module-icon {
            color: #0756ba;
        }
        .module-card.icon-teal .module-icon {
            color: #12b7bf;
        }
        .module-card.icon-green .module-icon {
            color: #0a8a5a;
        }
        .module-card.icon-orange .module-icon {
            color: #e67e22;
        }
        .module-card.icon-purple .module-icon {
            color: #7c3aed;
        }
        .module-card.icon-red .module-icon {
            color: #c0392b;
        }
        .module-card.icon-pink .module-icon {
            color: #db2777;
        }
        .module-card.icon-indigo .module-icon {
            color: #4f46e5;
        }
        .module-card.icon-amber .module-icon {
            color: #d97706;
        }
        .module-card.icon-cyan .module-icon {
            color: #0891b2;
        }
        .module-card.icon-emerald .module-icon {
            color: #059669;
        }
        .module-card.icon-violet .module-icon {
            color: #7c3aed;
        }
        .module-card.icon-rose .module-icon {
            color: #e11d48;
        }
    </style>
</head>
<body>

    <!-- ============================================================
    DROPDOWN OVERLAY
    ============================================================ -->
    <div class="dropdown-overlay" id="dropdownOverlay"></div>

    <!-- ============================================================
    FIXED TOP HEADER
    ============================================================ -->
    <header class="app-header" id="appHeader">
        <!-- Left: Logo + System Name -->
        <div class="header-left">
            <div class="header-logo">
                <i class="fas fa-tooth"></i>
            </div>
            <div class="header-brand">
                <span class="system-name">Choice Dental Care <i class="system-version">v2.4.1</i></span>  
            </div>
            <span class="header-date" id="currentDate">
                <span class="user-divider"></span>
                <span class="day-name" id="dayName"></span>,
                <span id="fullDate"></span>
            </span>
        </div>

       <!-- Right: User Info + Avatar -->
            <div class="header-right">
                <div class="header-user">
                    <span class="user-role" id="role"></span>
                    <span class="user-divider">|</span>
                    <span class="displayName" id="displayName"></span>
                </div>
                <div class="avatar-wrapper" id="avatarWrapper">
                    <div class="avatar" id="avatarBtn">
                        <!-- Initials will be inserted here by JavaScript -->
                        <span class="dropdown-arrow"><i class="fas fa-chevron-down"></i></span>
                    </div>
                    <!-- Dropdown Menu -->
                    <div class="dropdown-menu" id="dropdownMenu">
                        <button class="dropdown-item" onclick="handleChangePassword()">
                            <i class="fas fa-key"></i> Change Password
                        </button>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item danger" onclick="handleLogout()">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </button>
                    </div>
                </div>
            </div>
    </header>

    <!-- ============================================================
    MAIN CONTENT
    ============================================================ -->
    <main class="app-main">
        <div class="modules-grid" id="modulesGrid">
            <!-- 1. Reception Works -->
            <button class="module-card icon-cyan" data-module="reception" role="button" tabindex="0">
                <div class="module-icon"><i class="fas fa-hospital"></i></div>
                <div class="module-title">Reception Works</div>
            </button>
            <!-- 2. Revenue Works -->
            <button class="module-card icon-amber" data-module="revenue" role="button" tabindex="0">
                <div class="module-icon"><i class="fas fa-coins"></i></div>
                <div class="module-title">Revenue Works</div>
            </button>
            <!-- 3. Nurse Station Works -->
            <button class="module-card icon-pink" data-module="nurse" role="button" tabindex="0">
                <div class="module-icon"><i class="fas fa-stethoscope"></i></div>
                <div class="module-title">Nurse Station Works</div>
            </button>
            <!-- 4. Doctors Page Works -->
            <button class="module-card icon-blue" data-module="doctors" role="button" tabindex="0">
                <div class="module-icon"><i class="fas fa-user-md"></i></div>
                <div class="module-title">Doctors Page Works</div>
            </button>
            <!-- 5. Patient Records -->
            <button class="module-card icon-green" data-module="patients" role="button" tabindex="0">
                <div class="module-icon"><i class="fas fa-notes-medical"></i></div>
                <div class="module-title">Patient Records</div>
            </button>
            <!-- 6. Pharmacy Works -->
            <button class="module-card icon-purple" data-module="pharmacy" role="button" tabindex="0">
                <div class="module-icon"><i class="fas fa-prescription-bottle"></i></div>
                <div class="module-title">Pharmacy Works</div>
            </button>
            <!-- 7. Radiology Works -->
            <button class="module-card icon-violet" data-module="radiology" role="button" tabindex="0">
                <div class="module-icon"><i class="fas fa-x-ray"></i></div>
                <div class="module-title">Radiology Works</div>
            </button>
            <!-- 8. Procedure Works -->
            <button class="module-card icon-red" data-module="procedure" role="button" tabindex="0">
                <div class="module-icon"><i class="fas fa-syringe"></i></div>
                <div class="module-title">Procedure Works</div>
            </button>
            <!-- 9. Storage & Supply Works -->
            <button class="module-card icon-emerald" data-module="storage" role="button" tabindex="0">
                <div class="module-icon"><i class="fas fa-boxes"></i></div>
                <div class="module-title">Storage And Supply Works</div>
            </button>
            <!-- 10. Management Works -->
            <button class="module-card icon-orange" data-module="management" role="button" tabindex="0">
                <div class="module-icon"><i class="fas fa-chart-bar"></i></div>
                <div class="module-title">Management Works</div>
            </button>
            <!-- 11. General Ledger Works -->
            <button class="module-card icon-rose" data-module="ledger" role="button" tabindex="0">
                <div class="module-icon"><i class="fas fa-book"></i></div>
                <div class="module-title">General Ledger Works</div>
            </button>
            <!-- 12. User Management -->
            <button class="module-card icon-indigo" data-module="users" role="button" tabindex="0">
                <div class="module-icon"><i class="fas fa-users-cog"></i></div>
                <div class="module-title">User Management</div>
            </button>
            <!-- 13. Setup & Configuration -->
            <button class="module-card icon-teal" data-module="setup" role="button" tabindex="0">
                <div class="module-icon"><i class="fas fa-gear"></i></div>
                <div class="module-title">Setup & Configuration</div>
            </button>
        
        </div>
    </main>

    <!-- ============================================================
    FIXED FOOTER
    ============================================================ -->
    <footer class="app-footer">
        <div class="footer-left">
            <span>&copy; Powered By Philip Z.P</span>
            <span class="footer-divider">•</span>
            <span>v2.4.1</span>
            <span class="footer-divider">•</span>
            <span>Support: <a href="" style="color:var(--muted);text-decoration:none;">+255 753 682 610</button></span>
        </div>
        <div class="footer-right">
            <a href="#">Privacy Policy</a>
            <span class="footer-divider">•</span>
            <a href="#">Terms of Service</a>
        </div>
    </footer>

 <script src="../../assets/js/common.js"></script>
<script>
    // ============================================================
    // 1. MODULE DATA
    // ============================================================
    const moduleNames = {
        doctors: 'Doctors Page Works',
        setup: 'Setup & Configuration',
        patients: 'Patient Records',
        pharmacy: 'Pharmacy Works',
        revenue: 'Revenue Works',
        reception: 'Reception Works',
        users: 'User Management',
        management: 'Management Works',
        storage: 'Storage & Supply Works',
        nurse: 'Nurse Station Works',
        radiology: 'Radiology Works',
        ledger: 'General Ledger Works',
        procedure: 'Procedure Works'
    };

    // ============================================================
    // 2. MODULE ROUTES (Folder Structure Mapping)
    // ============================================================
    const moduleRoutes = {
        doctors: {
            path: '../doctors page works/doctors-works-dashboard.html'
        },
        setup: {
            path: '../setup & configurations/item-management.html'
        },
        patients: {
            path: '../reception works/all-patients.html'
        },
        pharmacy: {
            path: '#'  // Placeholder - page not created yet
        },
        revenue: {
            path: '#'  // Placeholder - page not created yet
        },
        reception: {
            path: '../reception works/reception-dashboard.html'
        },
        users: {
            path: '../user management/user-management.html'
        },
        management: {
            path: '#'  // Placeholder - page not created yet
        },
        storage: {
            path: '#'  // Placeholder - page not created yet
        },
        nurse: {
            path: '#'  // Placeholder - page not created yet
        },
        radiology: {
            path: '#'  // Placeholder - page not created yet
        },
        ledger: {
            path: '#'  // Placeholder - page not created yet
        },
        procedure: {
            path: '#'  // Placeholder - page not created yet
        }
    };

    // ============================================================
    // 3. RENDER MODULES (Static HTML already in place)
    // ============================================================
    function renderModules() {
        // Modules are already rendered in HTML
        // This function is kept for compatibility
        console.log('✅ Modules are statically rendered in HTML');
    }

    // ============================================================
    // 4. HANDLE MODULE CLICK
    // ============================================================
    function handleModuleClick(moduleId) {
        const route = moduleRoutes[moduleId];
        
        if (!route) {
            showToast(`⚠️ Module "${moduleId}" not configured.`, 'warning');
            console.warn(`⚠️ Module "${moduleId}" not found in routes.`);
            return;
        }
        
        const name = moduleNames[moduleId] || moduleId;
        const path = route.path;
        
        console.log(`🔗 Navigating to: ${name} -> ${path}`);
        showToast(`📂 Opening ${name}...`, 'info');
        
        if (path === '#') {
            showToast(`🚧 ${name} is under construction.`, 'warning');
            return;
        }
        
        window.location.href = path;
    }

    // ============================================================
    // 5. DROPDOWN CONTROLS
    // ============================================================
    const avatarBtn = document.getElementById('avatarBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const dropdownOverlay = document.getElementById('dropdownOverlay');

    function toggleDropdown() {
        const isOpen = dropdownMenu.classList.contains('open');
        dropdownMenu.classList.toggle('open');
        dropdownOverlay.classList.toggle('active');
        avatarBtn.setAttribute('aria-expanded', !isOpen);
    }

    function closeDropdown() {
        dropdownMenu.classList.remove('open');
        dropdownOverlay.classList.remove('active');
        avatarBtn.setAttribute('aria-expanded', 'false');
    }

    // ============================================================
    // 6. DROPDOWN ACTIONS
    // ============================================================
    function handleChangePassword() {
        closeDropdown();
        openPasswordModal();  // ← Defined in common.js
        console.log('🔑 Change Password clicked');
    }

    function handleLogout() {
        closeDropdown();
        logoutUser();  // ← Defined in common.js
    }

    // ============================================================
    // 7. DATE DISPLAY
    // ============================================================
    function updateDate() {
        const now = new Date();
        const options = {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        };
        const fullDateStr = now.toLocaleDateString('en-US', options);
        const parts = fullDateStr.split(',');
        document.getElementById('dayName').textContent = parts[0];
        document.getElementById('fullDate').textContent = parts.slice(1).join(',').trim();
    }

    // ============================================================
    // 8. TOAST NOTIFICATIONS
    // ============================================================
    function showToast(message, type = 'info', duration = 3000) {
        const existing = document.querySelector('.toast-notification');
        if (existing) existing.remove();

        const toast = document.createElement('div');
        toast.className = 'toast-notification';

        const icons = {
            success: 'fa-check-circle',
            error: 'fa-times-circle',
            info: 'fa-info-circle',
            warning: 'fa-exclamation-triangle'
        };

        const colors = {
            success: '#0a8a5a',
            error: '#c0392b',
            info: '#0756ba',
            warning: '#e67e22'
        };

        toast.style.cssText = `
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: ${colors[type] || colors.info};
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            font-family: var(--font);
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: toastIn 0.3s ease-out;
            max-width: 90%;
        `;

        toast.innerHTML = `
            <i class="fas ${icons[type] || icons.info}"></i>
            <span>${message}</span>
        `;

        if (!document.getElementById('toastStyles')) {
            const style = document.createElement('style');
            style.id = 'toastStyles';
            style.textContent = `
                @keyframes toastIn {
                    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
                    to { opacity: 1; transform: translateX(-50%) translateY(0); }
                }
                @keyframes toastOut {
                    from { opacity: 1; transform: translateX(-50%) translateY(0); }
                    to { opacity: 0; transform: translateX(-50%) translateY(20px); }
                }
            `;
            document.head.appendChild(style);
        }

        document.body.appendChild(toast);

        setTimeout(() => {
            toast.style.animation = 'toastOut 0.3s ease-in forwards';
            setTimeout(() => toast.remove(), 300);
        }, duration);
    }

    // ============================================================
    // 9. KEYBOARD SHORTCUTS
    // ============================================================
    document.addEventListener('keydown', (e) => {
        // Ctrl + Shift + L = Logout
        if (e.ctrlKey && e.shiftKey && e.key === 'L') {
            e.preventDefault();
            handleLogout();
        }
        // Escape = Close dropdown
        if (e.key === 'Escape') {
            closeDropdown();
        }
    });

    // ============================================================
    // 10. INITIALIZATION - SINGLE DOMContentLoaded
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        // Check authentication
        if (!requireAuth()) {
            return;
        }
        
        // Update header with user data
        updateHeaderWithUser();
        
        // Load modals (from common.js)
        if (typeof loadModals === 'function') {
            loadModals();
        }
        
        // Render modules (static HTML already there)
        renderModules();
        
        // Update date
        updateDate();
        setInterval(updateDate, 60000);
        
        // Setup dropdown event listeners
        avatarBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleDropdown();
        });

        dropdownOverlay.addEventListener('click', closeDropdown);

        document.addEventListener('click', (e) => {
            const wrapper = document.querySelector('.avatar-wrapper');
            if (!wrapper.contains(e.target)) {
                closeDropdown();
            }
        });
        
        // Setup module grid event listeners
        const grid = document.getElementById('modulesGrid');
        if (grid) {
            // Click handler
            grid.addEventListener('click', function(e) {
                const card = e.target.closest('.module-card');
                if (!card) return;
                e.preventDefault();
                const moduleId = card.dataset.module;
                handleModuleClick(moduleId);
            });

            // Keyboard handler (Enter/Space)
            grid.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    const card = e.target.closest('.module-card');
                    if (!card) return;
                    e.preventDefault();
                    const moduleId = card.dataset.module;
                    handleModuleClick(moduleId);
                }
            });
        }
        
        // Show welcome message
        const user = getUserSession();
        const greeting = user ? `👋 Welcome back, ${user.displayName}!` : '👋 Welcome to Choice Dental Care!';
        setTimeout(() => {
            showToast(greeting, 'success', 3000);
        }, 500);
        
        console.log('🦷 Choice Dental Care Dashboard loaded successfully!');
        console.log(`📦 ${Object.keys(moduleNames).length} modules available`);
        console.log(`👤 Logged in as: ${user ? user.displayName : 'Guest'}`);
    });
</script>
</body>
</html>
