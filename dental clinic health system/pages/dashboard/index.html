<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Choice Dental Care</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
           CSS VARIABLES
           ============================================================ */
        :root {
            --blue: #0759bc;
            --blue-deep: #073b8d;
            --teal: #12b7bf;
            --teal-pale: #e7f9fa;
            --ink: #14355f;
            --muted: #62728b;
            --line: #d8e2ed;
            --surface: #ffffff;
            --bg: #f4f9fc;
            --success: #0a8a5a;
            --success-bg: #e6f7f0;
            --danger: #c0392b;
            --danger-bg: #fde8e5;
            --warning: #e67e22;
            --warning-bg: #fef5e7;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.08);
            --radius: 14px;
            --radius-sm: 8px;
            --font: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
            --transition: all 0.25s ease;
            --header-height: 70px;
            --footer-height: 50px;
        }

        /* ============================================================
           RESET
           ============================================================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            padding-top: var(--header-height);
            padding-bottom: var(--footer-height);
        }

        /* ============================================================
           SCROLLBAR
           ============================================================ */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--line);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--muted);
        }

        /* ============================================================
           FIXED HEADER
           ============================================================ */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: var(--header-height);
            background: var(--surface);
            border-bottom: 1px solid var(--line);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
        }

        /* Header Left */
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .header-logo {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--blue);
            color: #fff;
            font-size: 20px;
        }

        .header-brand {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .header-brand .system-name {
            font-size: 16px;
            font-weight: 800;
            color: var(--ink);
            letter-spacing: -0.02em;
        }

        .header-brand .system-version {
            font-size: 11px;
            font-weight: 500;
            color: var(--muted);
        }

        /* Header Center */
        .header-center {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-date {
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
        }

        .header-date .day-name {
            font-weight: 600;
            color: var(--ink);
        }

        /* Header Right */
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-user .user-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .header-user .user-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--ink);
        }

        .header-user .user-divider {
            color: var(--line);
            font-weight: 300;
            margin: 0 2px;
        }

        /* Avatar */
        .avatar-wrapper {
            position: relative;
            cursor: pointer;
        }

        .avatar {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--blue), var(--teal));
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            transition: var(--transition);
            user-select: none;
        }

        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(7, 86, 186, 0.25);
        }

        .avatar .dropdown-arrow {
            position: absolute;
            bottom: -2px;
            right: -2px;
            font-size: 10px;
            background: var(--surface);
            border-radius: 50%;
            padding: 2px;
            color: var(--muted);
            border: 1px solid var(--line);
        }

        /* ============================================================
           DROPDOWN MENU
           ============================================================ */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            min-width: 200px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            padding: 6px 0;
            z-index: 1001;
            animation: dropdownIn 0.2s ease-out;
        }

        .dropdown-menu.open {
            display: block;
        }

        @keyframes dropdownIn {
            from {
                opacity: 0;
                transform: translateY(-8px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .dropdown-menu .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            color: var(--ink);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: var(--font);
        }

        .dropdown-menu .dropdown-item:hover {
            background: var(--teal-pale);
            color: var(--blue);
        }

        .dropdown-menu .dropdown-item i {
            width: 18px;
            font-size: 14px;
            color: var(--muted);
        }

        .dropdown-menu .dropdown-item:hover i {
            color: var(--blue);
        }

        .dropdown-menu .dropdown-divider {
            height: 1px;
            background: var(--line);
            margin: 4px 12px;
        }

        .dropdown-menu .dropdown-item.danger {
            color: var(--danger);
        }

        .dropdown-menu .dropdown-item.danger:hover {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .dropdown-menu .dropdown-item.danger:hover i {
            color: var(--danger);
        }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .app-main {
            margin: 0 auto;
            padding: 28px 32px;
            min-height: calc(100vh - var(--header-height) - var(--footer-height));
        }

        /* ============================================================
           MODULES GRID
           ============================================================ */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .module-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 15px 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            color: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            min-height: 120px;
        }

        .module-card:hover {
            transform: translateY(-4px);
            border-color: var(--blue);
            box-shadow: var(--shadow-lg);
            background: #a8caffdb;
        }

        .module-card:active {
            transform: translateY(0);
        }

        .module-card .module-icon {
            font-size: 36px;
            color: var(--blue);
            margin-bottom: 4px;
            transition: var(--transition);
        }

        .module-card:hover .module-icon {
            transform: scale(1.05);
        }

        .module-card .module-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.3;
        }

        .module-card .module-subtitle {
            font-size: 13px;
            font-weight: 400;
            color: var(--muted);
            line-height: 1.2;
        }

        /* Module card variations */
        .module-card .module-badge {
            margin-top: 8px;
            padding: 3px 12px;
            border-radius: 40px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            background: var(--teal-pale);
            color: var(--teal);
        }

        /* ============================================================
           FIXED FOOTER
           ============================================================ */
        .app-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 999;
            height: var(--footer-height);
            background: var(--surface);
            border-top: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            font-size: 12px;
            color: var(--muted);
        }

        .app-footer .footer-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .app-footer .footer-left .footer-divider {
            color: var(--line);
        }

        .app-footer .footer-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .app-footer .footer-right a {
            color: var(--muted);
            text-decoration: none;
            transition: var(--transition);
        }

        .app-footer .footer-right a:hover {
            color: var(--blue);
            text-decoration: underline;
        }

        /* ============================================================
           OVERLAY (for closing dropdown)
           ============================================================ */
        .dropdown-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
        }

        .dropdown-overlay.active {
            display: block;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 1200px) {
            .modules-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 16px;
            }
        }

        @media (max-width: 992px) {
            .modules-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
            }

            .app-header {
                padding: 0 20px;
            }

            .app-main {
                padding: 20px;
            }

            .app-footer {
                padding: 0 20px;
            }

            .header-date {
                font-size: 13px;
            }

            .header-user .user-title {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .modules-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }

            .app-header {
                padding: 0 16px;
                height: 60px;
            }

            .app-main {
                padding: 16px;
                padding-top: 16px;
            }

            .app-footer {
                padding: 0 16px;
                height: 44px;
                font-size: 11px;
                flex-wrap: wrap;
            }

            :root {
                --header-height: 60px;
                --footer-height: 44px;
            }

            .header-brand .system-name {
                font-size: 14px;
            }

            .header-brand .system-version {
                display: none;
            }

            .header-date {
                display: none;
            }

            .header-user .user-name {
                font-size: 13px;
            }

            .header-user .user-divider {
                display: none;
            }

            .module-card {
                padding: 20px 16px;
                min-height: 130px;
            }

            .module-card .module-icon {
                font-size: 28px;
            }

            .module-card .module-title {
                font-size: 13px;
            }

            .module-card .module-subtitle {
                font-size: 12px;
            }

            .app-footer .footer-right {
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .modules-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .app-header {
                padding: 0 12px;
            }

            .app-main {
                padding: 12px;
            }

            .app-footer {
                padding: 0 12px;
                font-size: 10px;
                flex-direction: column;
                justify-content: center;
                gap: 2px;
                height: 56px;
            }

            :root {
                --footer-height: 56px;
            }

            .header-brand .system-name {
                font-size: 13px;
            }

            .header-logo {
                width: 34px;
                height: 34px;
                font-size: 16px;
            }

            .header-user .user-name {
                font-size: 12px;
            }

            .avatar {
                width: 34px;
                height: 34px;
                font-size: 13px;
            }

            .dropdown-menu {
                min-width: 170px;
                right: -10px;
            }

            .module-card {
                padding: 16px 12px;
                min-height: 110px;
                border-radius: 12px;
            }

            .module-card .module-icon {
                font-size: 24px;
            }

            .module-card .module-title {
                font-size: 12px;
            }

            .module-card .module-subtitle {
                font-size: 11px;
            }

            .app-footer .footer-left {
                gap: 8px;
            }

            .app-footer .footer-right {
                gap: 8px;
            }
        }

        /* ============================================================
           UTILITY
           ============================================================ */
        .text-muted {
            color: var(--muted);
        }
        .text-center {
            text-align: center;
        }
        .mt-2 {
            margin-top: 8px;
        }
        .mb-2 {
            margin-bottom: 8px;
        }
        .gap-1 {
            gap: 4px;
        }
        .gap-2 {
            gap: 8px;
        }

        /* ============================================================
           MODULE ICON COLORS
           ============================================================ */
        .module-card.icon-blue .module-icon {
            color: #0756ba;
        }
        .module-card.icon-teal .module-icon {
            color: #12b7bf;
        }
        .module-card.icon-green .module-icon {
            color: #0a8a5a;
        }
        .module-card.icon-orange .module-icon {
            color: #e67e22;
        }
        .module-card.icon-purple .module-icon {
            color: #7c3aed;
        }
        .module-card.icon-red .module-icon {
            color: #c0392b;
        }
        .module-card.icon-pink .module-icon {
            color: #db2777;
        }
        .module-card.icon-indigo .module-icon {
            color: #4f46e5;
        }
        .module-card.icon-amber .module-icon {
            color: #d97706;
        }
        .module-card.icon-cyan .module-icon {
            color: #0891b2;
        }
        .module-card.icon-emerald .module-icon {
            color: #059669;
        }
        .module-card.icon-violet .module-icon {
            color: #7c3aed;
        }
        .module-card.icon-rose .module-icon {
            color: #e11d48;
        }
    </style>
</head>

                path: '#'  // Placeholder - page not created yet
            },
            radiology: {
                path: '#'  // Placeholder - page not created yet
            },
            ledger: {
                path: '#'  // Placeholder - page not created yet
            },
            procedure: {
                path: '#'  // Placeholder - page not created yet
            }
        };
        // ============================================================
        //  HANDLE MODULE CLICK
        // ============================================================
             function handleModuleClick(moduleId) {
        // Get the route for this module
        const route = moduleRoutes[moduleId];
        
        // Check if module exists in routes
        if (!route) {
            showToast(`⚠️ Module "${moduleId}" not configured.`, 'warning');
            console.warn(`⚠️ Module "${moduleId}" not found in routes.`);
            return;
        }
        
        // Get the name for toast message
        const name = moduleNames[moduleId] || moduleId;
        const path = route.path;
        
        console.log(`🔗 Navigating to: ${name} -> ${path}`);
        showToast(`📂 Opening ${name}...`, 'info');
        
        // Check if page exists (not placeholder)
        if (path === '#') {
            showToast(`🚧 ${name} is under construction.`, 'warning');
            return;
        }
        
        // Redirect to the page
        window.location.href = path;
    }
     // ============================================================
    //  MODULE CLICK HANDLER (Event Delegation)
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        const grid = document.getElementById('modulesGrid');

        // Click handler
        grid.addEventListener('click', function(e) {
            const card = e.target.closest('.module-card');
            if (!card) return;
            e.preventDefault();
            const moduleId = card.dataset.module;
            handleModuleClick(moduleId);
        });

        // Keyboard handler (Enter/Space)
        grid.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                const card = e.target.closest('.module-card');
                if (!card) return;
                e.preventDefault();
                const moduleId = card.dataset.module;
                handleModuleClick(moduleId);
            }
        });

        console.log('🦷 Choice Dental Care Dashboard loaded successfully!');
        console.log(`📦 ${Object.keys(moduleNames).length} modules available`);

        setTimeout(() => {
                const user = getUserSession();
                const greeting = user ? `👋 Welcome back, ${user.displayName}!` : '👋 Welcome';
            showToast(greeting, 'success', 3000);
        }, 500);
    });

        // ============================================================
        //  DROPDOWN CONTROLS
        // ============================================================
        const avatarBtn = document.getElementById('avatarBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const dropdownOverlay = document.getElementById('dropdownOverlay');

        function toggleDropdown() {
            const isOpen = dropdownMenu.classList.contains('open');
            dropdownMenu.classList.toggle('open');
            dropdownOverlay.classList.toggle('active');
            avatarBtn.setAttribute('aria-expanded', !isOpen);
        }

        function closeDropdown() {
            dropdownMenu.classList.remove('open');
            dropdownOverlay.classList.remove('active');
            avatarBtn.setAttribute('aria-expanded', 'false');
        }

        avatarBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleDropdown();
        });

        dropdownOverlay.addEventListener('click', closeDropdown);

        document.addEventListener('click', (e) => {
            const wrapper = document.querySelector('.avatar-wrapper');
            if (!wrapper.contains(e.target)) {
                closeDropdown();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeDropdown();
            }
        });

        // ============================================================
        // DROPDOWN ACTIONS
        // ============================================================
        function handleChangePassword() {
            closeDropdown();
            showToast('🔑 Redirecting to Change Password...', 'info');
            console.log('🔑 Change Password clicked');
        }

        function handleLogout() {
            closeDropdown();
            logoutUser();
        }

        // ============================================================
        //  DATE DISPLAY
        // ============================================================
        function updateDate() {
            const now = new Date();
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            };
            const fullDateStr = now.toLocaleDateString('en-US', options);
            const parts = fullDateStr.split(',');
            document.getElementById('dayName').textContent = parts[0];
            document.getElementById('fullDate').textContent = parts.slice(1).join(',').trim();
        }

        updateDate();
        setInterval(updateDate, 60000);

        // ============================================================
        //  TOAST NOTIFICATIONS
        // ============================================================
        function showToast(message, type = 'info', duration = 3000) {
            const existing = document.querySelector('.toast-notification');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast-notification';

            const icons = {
                success: 'fa-check-circle',
                error: 'fa-times-circle',
                info: 'fa-info-circle',
                warning: 'fa-exclamation-triangle'
            };

            const colors = {
                success: '#0a8a5a',
                error: '#c0392b',
                info: '#0756ba',
                warning: '#e67e22'
            };

            toast.style.cssText = `
                position: fixed;
                bottom: 80px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 9999;
                background: ${colors[type] || colors.info};
                color: #fff;
                padding: 12px 24px;
                border-radius: 10px;
                font-family: var(--font);
                font-size: 14px;
                font-weight: 500;
                box-shadow: 0 8px 30px rgba(0,0,0,0.15);
                display: flex;
                align-items: center;
                gap: 10px;
                animation: toastIn 0.3s ease-out;
                max-width: 90%;
            `;

            toast.innerHTML = `
                <i class="fas ${icons[type] || icons.info}"></i>
                <span>${message}</span>
            `;

            if (!document.getElementById('toastStyles')) {
                const style = document.createElement('style');
                style.id = 'toastStyles';
                style.textContent = `
                    @keyframes toastIn {
                        from { opacity: 0; transform: translateX(-50%) translateY(20px); }
                        to { opacity: 1; transform: translateX(-50%) translateY(0); }
                    }
                    @keyframes toastOut {
                        from { opacity: 1; transform: translateX(-50%) translateY(0); }
                        to { opacity: 0; transform: translateX(-50%) translateY(20px); }
                    }
                `;
                document.head.appendChild(style);
            }

            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'toastOut 0.3s ease-in forwards';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ============================================================
        //  KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && e.key === 'L') {
                e.preventDefault();
                handleLogout();
            }
        });
        // ============================================================
        //  INITIALIZATION
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // Check authentication
            if (!requireAuth()) {
                return;
            }
            
            // Update header with user data
            updateHeaderWithUser();
            
            renderModules();
            console.log('🦷 Choice Dental Care Dashboard loaded successfully!');
            console.log(`📦 ${Object.keys(moduleNames).length} modules available`);
            
            const user = getUserSession();
            const greeting = user ? `👋 Welcome back, ${user.displayName}!` : '👋 Welcome back!';
            setTimeout(() => {
                showToast(greeting, 'success', 3000);
            }, 500);
        });
    </script>
