<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/translator-styles.css">
    <title>Hospital Service Portal | Load Items — External Viewer</title>
    <style>
        /* ========================================
           UPLOAD ZONE STYLES (page-specific)
           ======================================== */
        .upload-zone {
            border: 2px dashed #b0b8c0;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            background: #f8fafc;
            margin: 15px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-zone:hover {
            border-color: var(--primary);
            background: #eef6ff;
        }

        .upload-zone.dragover {
            border-color: var(--primary);
            background: #dbeafe;
            transform: scale(1.01);
            box-shadow: 0 4px 20px rgba(52, 152, 219, 0.2);
        }

        .upload-zone i {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .upload-zone p {
            font-size: 16px;
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 5px;
        }

        .upload-zone span {
            font-size: 13px;
            color: var(--gray);
        }

        .upload-zone .file-hint {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 12px;
            background: rgba(52, 152, 219, 0.1);
            color: var(--primary);
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        /* When file is loaded, shrink upload zone to compact mode */
        .upload-zone.compact {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            text-align: left;
        }

        .upload-zone.compact i {
            font-size: 24px;
            margin-bottom: 0;
        }

        .upload-zone.compact .upload-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .upload-zone.compact p {
            font-size: 14px;
            margin-bottom: 2px;
        }

        .upload-zone.compact span {
            font-size: 12px;
        }

        .upload-zone.compact .change-file-btn {
            padding: 8px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-zone.compact .change-file-btn:hover {
            background: var(--primary-dark);
        }

        /* Info banner at top */
        .info-banner {
            background: linear-gradient(135deg, #e8f4fc 0%, #dbeafe 100%);
            border-left: 4px solid var(--primary);
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: var(--secondary);
        }

        .info-banner i {
            color: var(--primary);
            font-size: 18px;
        }

        .info-banner strong {
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .upload-zone {
                padding: 30px 15px;
            }
            .upload-zone i {
                font-size: 36px;
            }
            .upload-zone p {
                font-size: 14px;
            }
            .upload-zone.compact {
                flex-direction: column;
                text-align: center;
            }
            .upload-zone.compact .change-file-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>

    <!-- Main Content Wrapper -->
    <div class="main-content" id="mainContent">
        <!-- Header Container -->
        <div id="header-container"></div>

        <!-- Page Content -->
        <div id="page-content">
            <div class="page-container">
                <div class="page-header">
                    <i><h2><i class="fas fa-upload"></i> Read From External Sources </h2></i>
                    
                </div>

                    <div class="tabs-section">
                        <button class="tab-btn active" data-tab="price">
                            <i class="fas fa-tablets"></i> Price List
                        </button>
                        <button class="tab-btn" data-tab="visits">
                            <i class="fas fa-hospital-user"></i> Visit Types
                        </button>
                    </div>

                    <!-- Upload Zone -->
                    <div class="upload-zone" id="upload-zone">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <div class="upload-content">
                            <p>Click to upload or drag & drop</p>
                            <span>Supports .json and .txt files</span>
                            <span class="file-hint" id="upload-hint">Currently viewing: Price List</span>
                        </div>
                        <input type="file" id="file-input" accept=".json,.txt" hidden>
                    </div>

                    <div class="file-info" id="file-info" style="display: none;">
                        <div class="file-info-item"><strong>📄 File:</strong> <span id="file-name"></span></div>
                        <div class="file-info-item"><strong>📊 Size:</strong> <span id="file-size"></span></div>
                        <div class="file-info-item"><strong>🔢 Items:</strong> <span id="item-count"></span></div>
                        <div class="file-info-item"><strong>⏰ Loaded:</strong> <span id="load-time"></span></div>
                    </div>

                    <!-- Controls Section (NO export button) -->
                    <div class="controls" id="controls" style="display: none;">
                        <div class="search-box">
                            <input type="text" id="search-input" placeholder="Search across all fields...">
                        </div>
                        <div class="filter-box">
                            <span class="page-size-label">Show:</span>
                            <select id="pageSize">
                                <option value="20">20</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                                <option value="300">300</option>
                                <option value="ALL">All Items</option>
                            </select>
                            <select id="column-filter">
                                <option value="">Filter by Column</option>
                            </select>
                            <input type="text" id="filter-value" placeholder="Filter value..." style="display: none;">
                            <select id="scheme-value" style="display: none; min-width: 200px;">
                                <option value="">Select Benefit Scheme...</option>
                            </select>
                        </div>
                        <div class="action-buttons">
                            <button id="reset-filters" class="secondary">
                                <i class="fas fa-undo-alt"></i> Reset Filters
                            </button>
                        </div>
                    </div>

                    <!-- Stats Section (same) -->
                    <div class="stats-info" id="stats-info" style="display: none;">
                        <span id="filter-stats"></span> |
                        <span id="restricted-count"></span> |
                        <span id="price-range"></span>
                    </div>

                    <!-- Table Container -->
                    <div id="table-container">
                        <div class="loading-overlay" id="loading-overlay" style="display: none;">
                            <div class="spinner"></div>
                            <p>Processing file...</p>
                        </div>

                        <div class="empty-state" id="empty-state">
                            <div class="empty-state-icon">📁</div>
                        </div>

                        <table id="items-table" style="display: none;">
                            <thead id="table-header"></thead>
                            <tbody id="table-body"></tbody>
                        </table>
                    </div>

                    <!-- Popup Details Modal (same) -->
                    <div id="more-details">
                        <div>
                            <div class="popup-header">
                                <h3>More Details</h3>
                                <button class="popup-close" title="Close">✕</button>
                            </div>
                            <div class="popup-content">
                                <table id="popup_table">
                                    <thead id="pop-header"></thead>
                                    <tbody id="pop-body"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Pagination (same) -->
                    <div class="pagination" id="pagination" style="display: none;"></div>

                    <!-- Notification -->
                    <div id="notification" class="notification"></div>
                </div>
            </div>
        </div>

        <!-- Footer Container -->
        <div id="footer-container"></div>
    </div>

    <!-- Modals Container -->
    <div id="modals-container"></div>

    <!-- Scripts -->
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/load-items.js"></script>

    <script>
        // ========================================
        // COMPONENT LOADING
        // ========================================

        async function loadComponents() {
            try {
                // Load sidebar
                const sidebarRes = await fetch('../../components/sidebar.html');
                if (sidebarRes.ok) {
                    document.getElementById('sidebar-container').innerHTML = await sidebarRes.text();
                }

                // Load header
                const headerRes = await fetch('../../components/header.html');
                if (headerRes.ok) {
                    document.getElementById('header-container').innerHTML = await headerRes.text();
                }

                // Load footer
                const footerRes = await fetch('../../components/footer.html');
                if (footerRes.ok) {
                    document.getElementById('footer-container').innerHTML = await footerRes.text();
                }

                // Load modals
                const modalsRes = await fetch('../../components/modals.html');
                if (modalsRes.ok) {
                    document.getElementById('modals-container').innerHTML = await modalsRes.text();
                }

                // Initialize after components loaded
                initPageComponents();

            } catch (error) {
                console.error('Error loading components:', error);
            }
        }

        function initPageComponents() {
            // Initialize user dropdown
            if (typeof initUserDropdown === 'function') {
                initUserDropdown();
            }

            // Set user info from sessionStorage
            const userName = sessionStorage.getItem('userName') || 'Phillip Z.P';
            const jobTitle = sessionStorage.getItem('jobTitle') || 'System Administrator';

            const userNameSpan = document.getElementById('userName');
            const jobTitleSpan = document.getElementById('jobTitle');
            const userAvatar = document.getElementById('userAvatar');

            if (jobTitleSpan) jobTitleSpan.textContent = jobTitle + ' |';
            if (userNameSpan) userNameSpan.textContent = userName;
            if (userAvatar) {
                const initials = userName.split(' ').map(n => n[0]).join('');
                userAvatar.textContent = initials;
            }

            // Sidebar toggle (hamburger menu)
            const menuToggle = document.getElementById('menuToggle');
            if (menuToggle) {
                menuToggle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleSidebar();
                });
            }

            // Close sidebar button (X button)
            const closeSidebarBtn = document.getElementById('closeSidebarBtn');
            if (closeSidebarBtn) {
                closeSidebarBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    closeSidebar();
                });
            }

            // Initialize sidebar state
            initSidebarState();

            // Handle window resize
            window.addEventListener('resize', function() {
                handleResponsiveSidebar();
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!requireLogin()) return;
            loadComponents();
        });
    </script>
</body>
</html>
