<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Under Maintenance</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg: #05070d;
            --card: rgba(255, 255, 255, 0.055);
            --border: rgba(255, 255, 255, 0.12);
            --text: #ffffff;
            --muted: #9ca3af;
            --accent: #7c3aed;
            --accent-2: #06b6d4;
            --accent-3: #ec4899;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Inter", sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        /* =========================
           BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -10;
            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(124, 58, 237, 0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 75%,
                    rgba(6, 182, 212, 0.15),
                    transparent 32%
                ),
                #05070d;
        }

        .background::before {
            content: "";
            position: absolute;
            inset: -50%;
            background:
                conic-gradient(
                    from 0deg,
                    transparent,
                    rgba(124, 58, 237, 0.12),
                    transparent,
                    rgba(6, 182, 212, 0.10),
                    transparent
                );
            animation: rotateBackground 25s linear infinite;
        }

        @keyframes rotateBackground {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           GRID
        ========================= */

        .grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 55px 55px;

            mask-image: linear-gradient(
                to bottom,
                transparent,
                black 20%,
                black 80%,
                transparent
            );

            animation: gridMove 18s linear infinite;
        }

        @keyframes gridMove {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(55px);
            }
        }

        /* =========================
           ORBS
        ========================= */

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 10s ease-in-out infinite;
        }

        .orb.one {
            width: 300px;
            height: 300px;
            background: var(--accent);
            top: -100px;
            left: -80px;
        }

        .orb.two {
            width: 350px;
            height: 350px;
            background: var(--accent-2);
            bottom: -150px;
            right: -100px;
            animation-delay: -4s;
        }

        .orb.three {
            width: 180px;
            height: 180px;
            background: var(--accent-3);
            top: 45%;
            right: 10%;
            opacity: 0.18;
            animation-delay: -7s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate3d(0, 0, 0) scale(1);
            }

            50% {
                transform: translate3d(30px, -40px, 0) scale(1.08);
            }
        }

        /* =========================
           PARTICLES
        ========================= */

        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255,255,255,0.65);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(255,255,255,0.5);
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            from {
                transform: translateY(110vh);
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            85% {
                opacity: 1;
            }

            to {
                transform: translateY(-10vh);
                opacity: 0;
            }
        }

        /* =========================
           PAGE
        ========================= */

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        /* =========================
           CARD
        ========================= */

        .card {
            position: relative;
            width: min(900px, 100%);
            padding: 75px 60px;
            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.09),
                    rgba(255,255,255,0.025)
                );

            border: 1px solid var(--border);
            border-radius: 32px;

            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);

            box-shadow:
                0 30px 100px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.08);

            animation:
                cardIn 1s cubic-bezier(.16,1,.3,1) forwards,
                cardFloat 7s ease-in-out infinite 1s;

            opacity: 0;
            transform: translateY(40px) scale(.96);
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;

            background: linear-gradient(
                120deg,
                rgba(124,58,237,.5),
                transparent 35%,
                rgba(6,182,212,.4),
                transparent 70%,
                rgba(236,72,153,.3)
            );

            mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);

            mask-composite: exclude;
            pointer-events: none;
        }

        @keyframes cardIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes cardFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        /* =========================
           ICON
        ========================= */

        .icon {
            width: 92px;
            height: 92px;
            margin: 0 auto 35px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 28px;

            background:
                linear-gradient(
                    135deg,
                    rgba(124,58,237,.2),
                    rgba(6,182,212,.12)
                );

            border: 1px solid rgba(255,255,255,.12);

            box-shadow:
                0 0 50px rgba(124,58,237,.18),
                inset 0 0 30px rgba(255,255,255,.03);

            animation: iconPulse 4s ease-in-out infinite;
        }

        .icon svg {
            width: 44px;
            height: 44px;
            stroke: white;
            stroke-width: 1.5;
            fill: none;
        }

        @keyframes iconPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 40px rgba(124,58,237,.18);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 0 70px rgba(6,182,212,.22);
            }
        }

        /* =========================
           BADGE
        ========================= */

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            padding: 8px 15px;
            margin-bottom: 25px;

            border: 1px solid rgba(255,255,255,.1);
            border-radius: 999px;

            background: rgba(255,255,255,.045);

            color: #c4b5fd;

            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #a78bfa;
            box-shadow: 0 0 15px #8b5cf6;
            animation: statusPulse 1.7s ease-in-out infinite;
        }

        @keyframes statusPulse {
            50% {
                transform: scale(1.5);
                opacity: .5;
            }
        }

        /* =========================
           HEADING
        ========================= */

        h1 {
            font-size: clamp(44px, 7vw, 82px);
            line-height: .98;
            letter-spacing: -4px;
            font-weight: 800;

            background:
                linear-gradient(
                    100deg,
                    #ffffff 10%,
                    #c4b5fd 45%,
                    #67e8f9 80%
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            animation: textReveal 1.2s .25s both;
        }

        @keyframes textReveal {
            from {
                opacity: 0;
                filter: blur(15px);
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0);
            }
        }

        .description {
            max-width: 650px;
            margin: 28px auto 0;

            color: var(--muted);

            font-size: clamp(16px, 2vw, 19px);
            line-height: 1.8;
            font-weight: 400;

            animation: fadeUp 1s .55s both;
        }

        .description strong {
            color: #e5e7eb;
            font-weight: 600;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           BUTTON
        ========================= */

        .button-wrapper {
            margin-top: 42px;
            animation: fadeUp 1s .75s both;
        }

        .dashboard-button {
            position: relative;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            padding: 16px 25px;

            color: white;
            text-decoration: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    110deg,
                    #7c3aed,
                    #6366f1,
                    #0891b2
                );

            background-size: 200% 100%;

            font-size: 14px;
            font-weight: 700;

            box-shadow:
                0 15px 35px rgba(124,58,237,.25),
                inset 0 1px 0 rgba(255,255,255,.25);

            overflow: hidden;

            transition:
                transform .35s ease,
                box-shadow .35s ease,
                background-position .5s ease;
        }

        .dashboard-button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;

            background: linear-gradient(
                100deg,
                transparent,
                rgba(255,255,255,.3),
                transparent
            );

            transform: skewX(-20deg);
            transition: left .7s ease;
        }

        .dashboard-button:hover {
            transform: translateY(-4px);
            background-position: 100% 0;

            box-shadow:
                0 20px 45px rgba(124,58,237,.4),
                0 0 35px rgba(6,182,212,.12);
        }

        .dashboard-button:hover::before {
            left: 140%;
        }

        .dashboard-button:active {
            transform: translateY(-1px) scale(.98);
        }

        .arrow {
            display: inline-flex;
            transition: transform .3s ease;
        }

        .dashboard-button:hover .arrow {
            transform: translateX(5px);
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 45px;

            color: #5f6675;

            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;

            animation: fadeUp 1s 1s both;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {
            body {
                overflow: auto;
            }

            .page {
                min-height: 100svh;
                padding: 18px;
            }

            .card {
                padding: 55px 25px;
                border-radius: 25px;
            }

            h1 {
                letter-spacing: -2.5px;
            }

            .icon {
                width: 78px;
                height: 78px;
                border-radius: 23px;
            }

            .description {
                line-height: 1.7;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- Animated background -->
    <div class="background">
        <div class="grid"></div>

        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>

        <div class="particles" id="particles"></div>
    </div>


    <main class="page">

        <section class="card">

            <!-- Maintenance icon -->
            <div class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="M14.7 6.3a4.1 4.1 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4.1 4.1 0 0 0 5.4-5.4l-2.2 2.2-2.2-.5-.5-2.2z"/>
                    <path d="M16 8l2-2"/>
                </svg>
            </div>


            <!-- Status -->
            <div class="badge">
                <span class="status-dot"></span>
                System Maintenance
            </div>


            <!-- Main heading -->
            <h1>Hello there!</h1>


            <!-- Message -->
            <p class="description">
                This page is currently under maintenance
                but will be <strong>available soon.</strong>
                <br>
                We're making a few improvements behind the scenes
                to give you an even better experience.
            </p>


            <!-- Button -->
            <div class="button-wrapper">
                <a href="../../index.html" class="dashboard-button">
                    Back to Dashboard

                    <span class="arrow">
                        →
                    </span>
                </a>
            </div>


            <!-- Footer -->
            <div class="footer">
                We'll be back shortly · Thank you for your patience
            </div>

        </section>

    </main>


    <script>
        /*
         * Generate atmospheric floating particles
         */

        const particles = document.getElementById("particles");

        const particleCount = 45;

        for (let i = 0; i < particleCount; i++) {

            const particle = document.createElement("span");

            particle.className = "particle";

            particle.style.left =
                Math.random() * 100 + "%";

            particle.style.animationDuration =
                (Math.random() * 15 + 10) + "s";

            particle.style.animationDelay =
                -(Math.random() * 20) + "s";

            particle.style.opacity =
                Math.random() * 0.7 + 0.2;

            particle.style.transform =
                `scale(${Math.random() * 1.5 + .5})`;

            particles.appendChild(particle);
        }


        /*
         * Subtle mouse-based parallax
         */

        const card = document.querySelector(".card");

        document.addEventListener("mousemove", (event) => {

            if (window.innerWidth < 800) return;

            const x =
                (event.clientX / window.innerWidth - .5) * 2;

            const y =
                (event.clientY / window.innerHeight - .5) * 2;

            card.style.transform =
                `perspective(1200px)
                 rotateY(${x * 2}deg)
                 rotateX(${y * -2}deg)
                 translateY(-4px)`;
        });

        document.addEventListener("mouseleave", () => {
            card.style.transform = "";
        });
    </script>

</body>
</html>
